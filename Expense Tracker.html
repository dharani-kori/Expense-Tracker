<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
padding:20px;
transition:0.3s;
}

body.dark{
background:#1e1e1e;
color:white;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.dark .container{
background:#2d2d2d;
}

h1,h2,h3{
margin-bottom:10px;
}

input,
select,
button{
width:100%;
padding:10px;
margin:6px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
cursor:pointer;
background:#0d6efd;
color:white;
border:none;
}

button:hover{
opacity:0.9;
}

.summary{
display:flex;
gap:15px;
margin:20px 0;
}

.card{
flex:1;
padding:15px;
background:#f0f0f0;
border-radius:10px;
text-align:center;
}

.dark .card{
background:#444;
}

.filters{
display:flex;
gap:10px;
margin-top:10px;
}

ul{
list-style:none;
margin-top:20px;
}

li{
background:#f8f8f8;
padding:15px;
border-radius:8px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.dark li{
background:#555;
}

.actions button{
width:auto;
padding:8px 12px;
margin-left:5px;
}

.edit-btn{
background:#198754;
}

.delete-btn{
background:#dc3545;
}

.export-btn{
background:#6f42c1;
}

.chart-box{
margin-top:30px;
}

@media(max-width:768px){

.summary{
flex-direction:column;
}

.filters{
flex-direction:column;
}

li{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>💰 Expense Tracker Pro</h1>

<button onclick="toggleTheme()">
🌙 Toggle Dark Mode
</button>

<br><br>

<h2>
Balance: ₹<span id="balance">0</span>
</h2>

<div class="summary">

<div class="card">
<h3>Income</h3>
<p id="income">0</p>
</div>

<div class="card">
<h3>Expense</h3>
<p id="expense">0</p>
</div>

</div>

<form id="form">

<input
type="text"
id="title"
placeholder="Transaction Title"
required
>

<input
type="number"
id="amount"
placeholder="Amount (+income / -expense)"
required
>

<input
type="date"
id="date"
required
>

<select id="category">

<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
<option>Bills</option>
<option>Education</option>
<option>Entertainment</option>
<option>Other</option>

</select>

<button type="submit">
Save Transaction
</button>

</form>

<div class="filters">

<input
type="text"
id="search"
placeholder="Search Transactions"
>

<select id="filter">

<option value="all">
All Categories
</option>

<option value="Food">Food</option>
<option value="Travel">Travel</option>
<option value="Shopping">Shopping</option>
<option value="Bills">Bills</option>
<option value="Education">Education</option>
<option value="Entertainment">Entertainment</option>
<option value="Other">Other</option>

</select>

</div>

<button
class="export-btn"
onclick="exportCSV()"
>
Export CSV
</button>

<ul id="transactionList"></ul>

<div class="chart-box">

<h2>Monthly Expense Chart</h2>

<canvas id="chart"></canvas>

</div>

</div>

<script>
  let transactions =
JSON.parse(localStorage.getItem("transactions")) || [];

let editId = null;
let chart;

const form = document.getElementById("form");
const list = document.getElementById("transactionList");

const title = document.getElementById("title");
const amount = document.getElementById("amount");
const date = document.getElementById("date");
const category = document.getElementById("category");

function saveData(){
localStorage.setItem(
"transactions",
JSON.stringify(transactions)
);
render();
}

form.addEventListener("submit", function(e){

e.preventDefault();

const transaction = {
id: editId || Date.now(),
title: title.value,
amount: Number(amount.value),
date: date.value,
category: category.value
};

if(editId){

transactions =
transactions.map(t =>
t.id === editId ? transaction : t
);

editId = null;

}else{

transactions.push(transaction);

}

form.reset();
saveData();

});

function render(){

list.innerHTML = "";

const searchValue =
document.getElementById("search")
.value
.toLowerCase();

const filterValue =
document.getElementById("filter").value;

const filtered =
transactions.filter(t => {

const titleMatch =
(t.title || "")
.toLowerCase()
.includes(searchValue);

const categoryMatch =
filterValue === "all" ||
t.category === filterValue;

return titleMatch && categoryMatch;

});

filtered.forEach(t => {

const li =
document.createElement("li");

li.innerHTML = `
<div>
<strong>${t.title}</strong><br>
₹${t.amount}<br>
${t.category}<br>
${t.date}
</div>

<div class="actions">
<button
class="edit-btn"
onclick="editTransaction(${t.id})"
>
Edit
</button>

<button
class="delete-btn"
onclick="deleteTransaction(${t.id})"
>
Delete
</button>
</div>
`;

list.appendChild(li);

});

updateSummary();
drawChart();

}
function deleteTransaction(id){

transactions = transactions.filter(
t => t.id !== id
);

saveData();

}

function editTransaction(id){

const transaction = transactions.find(
item => item.id === id
);

if(!transaction){
alert("Transaction not found");
return;
}

title.value = transaction.title || "";
amount.value = transaction.amount || "";
date.value = transaction.date || "";
category.value = transaction.category || "Other";

editId = transaction.id;

window.scrollTo({
top: 0,
behavior: "smooth"
});

}

function updateSummary(){

const amounts =
transactions.map(t => t.amount);

const total =
amounts.reduce(
(a,b) => a+b,
0
);

const income =
amounts
.filter(a => a > 0)
.reduce(
(a,b) => a+b,
0
);

const expense =
Math.abs(
amounts
.filter(a => a < 0)
.reduce(
(a,b) => a+b,
0
)
);

document.getElementById("balance")
.innerText =
total.toFixed(2);

document.getElementById("income")
.innerText =
income.toFixed(2);

document.getElementById("expense")
.innerText =
expense.toFixed(2);

}

function toggleTheme(){

document.body.classList.toggle("dark");

localStorage.setItem(
"theme",
document.body.classList.contains("dark")
? "dark"
: "light"
);

}

if(
localStorage.getItem("theme")
=== "dark"
){
document.body.classList.add("dark");
}

document
.getElementById("search")
.addEventListener(
"input",
render
);

document
.getElementById("filter")
.addEventListener(
"change",
render
);

function exportCSV(){

let csv = "Title,Amount,Category,Date\n";

transactions.forEach(t => {

csv += `${t.title || ""},${t.amount || 0},${t.category || ""},"${t.date || ""}"\n`;

});

const blob = new Blob([csv], {
type: "text/csv"
});

function exportCSV(){

let csv = "Title,Amount,Category,Date\n";

transactions.forEach(t => {

csv += `${t.title || ""},${t.amount || 0},${t.category || ""},"${t.date || ""}"\n`;

});

const blob = new Blob([csv], {
type: "text/csv"
});

const a = document.createElement("a");

a.href = URL.createObjectURL(blob);

a.download = "expenses.csv";

a.click();

}

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"expenses.csv";

a.click();

}

function drawChart(){

const monthly = {};

transactions.forEach(t => {

if(t.amount < 0){

const month =
t.date.slice(0,7);

monthly[month] =
(monthly[month] || 0)
+
Math.abs(t.amount);

}

});

const labels =
Object.keys(monthly);

const values =
Object.values(monthly);

if(chart){
chart.destroy();
}

chart =
new Chart(
document.getElementById("chart"),
{
type:"bar",
data:{
labels:labels,
datasets:[
{
label:
"Monthly Expenses",
data:values,
borderWidth:1
}
]
},
options:{
responsive:true
}
}
);

}

render();
</script>
</body>
</html>
